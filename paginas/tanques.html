{% extends "paginas/base.html" %}
{% block titulo %}Tanques{% endblock %}
{% block conteudo %}
<h1>Tanques</h1>
<p class="subtitulo">Campos com * são obrigatórios.</p>
<section class="painel modulo" data-tabela="tanques">
    <h2>Tanques</h2>
    
    <form class="formulario">
        <div class="campo">
            <label for="tanques-identificacao">Identificação *</label>
            <input type="text" id="tanques-identificacao" name="identificacao" required maxlength="150">
        </div>
        <div class="campo">
            <label for="tanques-tipo">Tipo</label>
            <select id="tanques-tipo" name="tipo"><option value="">Selecione</option><option>Escavado</option><option>Alvenaria</option><option>Rede</option><option>Bioflocos</option></select>
        </div>
        <div class="campo">
            <label for="tanques-volume">Volume (m³)</label>
            <input type="number" id="tanques-volume" name="volume" min="0" step="0.1">
        </div>
        <div class="campo">
            <label for="tanques-profundidade">Profundidade (m)</label>
            <input type="number" id="tanques-profundidade" name="profundidade" min="0" step="0.1">
        </div>
        <div class="campo">
            <label for="tanques-status">Status</label>
            <select id="tanques-status" name="status"><option value="">Selecione</option><option>Ativo</option><option>Manutenção</option><option>Inativo</option></select>
        </div>
        <div class="campo largura-total">
            <label for="tanques-localizacao">Localização</label>
            <textarea id="tanques-localizacao" name="localizacao" rows="2"></textarea>
        </div>
        
        <div class="largura-total acoes">
            <button type="submit">Cadastrar</button>
            <button type="reset" class="secundario">Limpar</button>
        </div>
    </form>
    <p class="mensagem" role="status"></p>
    <div class="consulta"><h3>Registros cadastrados</h3><button type="button" class="atualizar secundario">Atualizar</button></div>
    <div class="tabela"><table>
        <thead><tr><th>ID</th>
                <th data-campo="identificacao">Identificação</th>
                <th data-campo="tipo">Tipo</th>
                <th data-campo="volume">Volume (m³)</th>
                <th data-campo="profundidade">Profundidade (m)</th>
                <th data-campo="status">Status</th>
                <th data-campo="localizacao">Localização</th>
        </tr></thead><tbody></tbody>
    </table></div>
</section>
{% endblock %}
