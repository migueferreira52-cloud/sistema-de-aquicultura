{% extends "paginas/base.html" %}
{% block titulo %}Espécies{% endblock %}
{% block conteudo %}
<h1>Espécies</h1>
<p class="subtitulo">Campos com * são obrigatórios.</p>
<section class="painel modulo" data-tabela="especies">
    <h2>Espécies</h2>
    
    <form class="formulario">
        <div class="campo">
            <label for="especies-nome_comum">Nome comum *</label>
            <input type="text" id="especies-nome_comum" name="nome_comum" required maxlength="150">
        </div>
        <div class="campo">
            <label for="especies-nome_cientifico">Nome científico</label>
            <input type="text" id="especies-nome_cientifico" name="nome_cientifico" maxlength="150">
        </div>
        <div class="campo">
            <label for="especies-tipo">Tipo</label>
            <select id="especies-tipo" name="tipo"><option value="">Selecione</option><option>Peixe</option><option>Camarão</option><option>Outro</option></select>
        </div>
        <div class="campo">
            <label for="especies-temperatura">Temperatura ideal (°C)</label>
            <input type="number" id="especies-temperatura" name="temperatura" min="0" step="0.1">
        </div>
        <div class="campo">
            <label for="especies-ph">pH ideal</label>
            <input type="number" id="especies-ph" name="ph" min="0" max="14" step="0.1">
        </div>
        <div class="campo largura-total">
            <label for="especies-observacoes">Observações</label>
            <textarea id="especies-observacoes" name="observacoes" rows="2"></textarea>
        </div>
        
        <div class="largura-total acoes">
            <button type="submit">Cadastrar</button>
            <button type="reset" class="secundario">Limpar</button>
        </div>
    </form>
    <p class="mensagem" role="status"></p>
    <div class="consulta"><h3>Registros cadastrados</h3><button type="button" class="atualizar secundario">Atualizar</button></div>
    <div class="tabela"><table>
        <thead><tr><th>ID</th>
                <th data-campo="nome_comum">Nome comum</th>
                <th data-campo="nome_cientifico">Nome científico</th>
                <th data-campo="tipo">Tipo</th>
                <th data-campo="temperatura">Temperatura ideal (°C)</th>
                <th data-campo="ph">pH ideal</th>
                <th data-campo="observacoes">Observações</th>
        </tr></thead><tbody></tbody>
    </table></div>
</section>
{% endblock %}
