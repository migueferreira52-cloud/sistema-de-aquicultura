{% extends "paginas/base.html" %}
{% block titulo %}Mortalidade{% endblock %}
{% block conteudo %}
<h1>Mortalidade</h1>
<p class="subtitulo">Campos com * são obrigatórios.</p>
<section class="painel modulo" data-tabela="mortalidade">
    <h2>Mortalidade</h2>
    
    <form class="formulario">
        <div class="campo">
            <label for="mortalidade-data">Data *</label>
            <input type="date" id="mortalidade-data" name="data" required>
        </div>
        <div class="campo">
            <label for="mortalidade-lote_id">Lote *</label>
            <select id="mortalidade-lote_id" name="lote_id" required data-origem="lotes" data-rotulo="codigo"><option value="">Selecione</option></select>
        </div>
        <div class="campo">
            <label for="mortalidade-quantidade">Quantidade morta *</label>
            <input type="number" id="mortalidade-quantidade" name="quantidade" required min="1" step="1">
        </div>
        <div class="campo">
            <label for="mortalidade-suspeita">Suspeita / causa</label>
            <input type="text" id="mortalidade-suspeita" name="suspeita" maxlength="150">
        </div>
        <div class="campo">
            <label for="mortalidade-destinacao">Destinação</label>
            <select id="mortalidade-destinacao" name="destinacao"><option value="">Selecione</option><option>Compostagem</option><option>Enterro</option><option>Coleta</option></select>
        </div>
        <div class="campo largura-total">
            <label for="mortalidade-observacoes">Observações</label>
            <textarea id="mortalidade-observacoes" name="observacoes" rows="2"></textarea>
        </div>
        <div class="campo">
            <label for="mortalidade-funcionario_id">Funcionário responsável</label>
            <select id="mortalidade-funcionario_id" name="funcionario_id" data-origem="funcionarios" data-rotulo="nome"><option value="">Selecione</option></select>
        </div>
        
        <div class="largura-total acoes">
            <button type="submit">Cadastrar</button>
            <button type="reset" class="secundario">Limpar</button>
        </div>
    </form>
    <p class="mensagem" role="status"></p>
    <div class="consulta"><h3>Registros cadastrados</h3><button type="button" class="atualizar secundario">Atualizar</button></div>
    <div class="tabela"><table>
        <thead><tr><th>ID</th>
                <th data-campo="data">Data</th>
                <th data-campo="lote_id">Lote</th>
                <th data-campo="quantidade">Quantidade morta</th>
                <th data-campo="suspeita">Suspeita / causa</th>
                <th data-campo="destinacao">Destinação</th>
                <th data-campo="observacoes">Observações</th>
                <th data-campo="funcionario_id">Funcionário responsável</th>
        </tr></thead><tbody></tbody>
    </table></div>
</section>
{% endblock %}
