{% extends "paginas/base.html" %}
{% block titulo %}Equipamentos{% endblock %}
{% block conteudo %}
<h1>Equipamentos</h1>
<p class="subtitulo">Campos com * são obrigatórios.</p>
<section class="painel modulo" data-tabela="equipamentos">
    <h2>Equipamentos</h2>
    
    <form class="formulario">
        <div class="campo">
            <label for="equipamentos-nome">Nome do equipamento *</label>
            <input type="text" id="equipamentos-nome" name="nome" required maxlength="150">
        </div>
        <div class="campo">
            <label for="equipamentos-tanque_id">Tanque</label>
            <select id="equipamentos-tanque_id" name="tanque_id" data-origem="tanques" data-rotulo="identificacao"><option value="">Selecione</option></select>
        </div>
        
        <div class="largura-total acoes">
            <button type="submit">Cadastrar</button>
            <button type="reset" class="secundario">Limpar</button>
        </div>
    </form>
    <p class="mensagem" role="status"></p>
    <div class="consulta"><h3>Registros cadastrados</h3><button type="button" class="atualizar secundario">Atualizar</button></div>
    <div class="tabela"><table>
        <thead><tr><th>ID</th>
                <th data-campo="nome">Nome do equipamento</th>
                <th data-campo="tanque_id">Tanque</th>
        </tr></thead><tbody></tbody>
    </table></div>
</section>
{% endblock %}
